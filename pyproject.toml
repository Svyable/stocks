[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svyable-stock-ranker"
version = "0.1.0"
description = "Systematic market/theme/leader/setup/breakout stock ranking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "tabulate>=0.9",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
stock-rank = "stocks_ranker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
